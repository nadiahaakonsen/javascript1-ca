<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainy Days</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/index.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Rainy Days Store</h1>
    </header>

    <main>
      <div class="search-container">
        <!-- Search form will go here in a future lesson -->
        <form id="searchForm">
          <input type="search" id="searchInput" placeholder="Search products..." />
        </form>
      </div>

      <div id="resultsContainer">
        <!-- Product cards will be rendered here by JavaScript -->
        <p>Loading products...</p>
      </div>

      <div id="paginationContainer" class="pagination-controls">
        <!-- Pagination buttons will be rendered here by JavaScript -->
      </div>
    </main>

    <footer>
      <p>&copy; 2025 Rainy Days</p>
    </footer>
  </body>
</html>
